<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doc Viewer</title>
  
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f111a">

  <!-- Core Libraries -->
  <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
  <script src="https://unpkg.com/docx-preview/dist/docx-preview.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    body { 
      background-color: #0f111a; 
      color: #fff; 
      display: flex; 
      flex-direction: column; 
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* HEADER */
    header { 
      padding: 10px 15px; 
      background: #1a1c29; 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-bottom: 1px solid #2d3142; 
      flex-shrink: 0;
    }
    header img {
      width: 24px;
      height: 24px;
    }
    h1 { font-size: 1rem; font-weight: 600; color: #82aaff; }

    /* UPLOAD BAR */
    .upload-bar { 
      padding: 10px; 
      text-align: center; 
      background: #12141f;
      flex-shrink: 0;
    }
    input[type="file"] { display: none; }
    .btn { 
      background: #4f46e5; 
      color: white; 
      padding: 8px 18px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 0.85rem; 
      display: inline-block; 
      font-weight: 500;
    }

    /* SCROLL CONTAINER (Left-Right & Top-Bottom) */
    #viewer-container {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow-x: auto !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      background: #0f111a;
      padding: 10px;
      touch-action: pan-x pan-y;
    }

    /* ZOOM CANVAS */
    #zoom-wrapper {
      display: inline-block;
      transform-origin: 0 0;
      min-width: 100%;
    }

    #viewer { 
      background: #ffffff; 
      color: #000; 
      border-radius: 6px; 
      padding: 15px;
      min-height: 80vh;
      min-width: 100%;
      display: inline-block;
    }

    /* WORD DOCUMENT STYLING */
    .docx-wrapper { 
      background: transparent !important; 
      padding: 0 !important; 
    }
    .docx-wrapper > section.docx { 
      min-width: 650px !important; 
      padding: 20px !important; 
      margin: 0 auto 15px auto !important; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.15) !important;
    }

    /* EXCEL TABLE STYLING */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }
    table { 
      border-collapse: collapse; 
      white-space: nowrap; 
    }
    th, td { 
      border: 1px solid #d1d5db; 
      padding: 6px 12px; 
      font-size: 0.85rem; 
      text-align: left; 
    }
    th { background: #f3f4f6; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <img src="icon.svg" alt="App Logo">
    <h1>Personal Document Reader</h1>
  </header>

  <div class="upload-bar">
    <label for="fileInput" class="btn">Select Document (.docx, .xlsx)</label>
    <input type="file" id="fileInput" accept=".docx, .xlsx, .xls">
  </div>

  <div id="viewer-container">
    <div id="zoom-wrapper">
      <div id="viewer">
        <p style="color: #6b7280; text-align: center; margin-top: 50px; font-size: 0.9rem;">
          Select a document above to read it.
        </p>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const viewer = document.getElementById('viewer');
    const container = document.getElementById('viewer-container');
    const zoomWrapper = document.getElementById('zoom-wrapper');

    // ---------------------------------------------------------
    // PERSISTENT TOUCH PINCH-TO-ZOOM ENGINE
    // ---------------------------------------------------------
    let scale = 1.0;
    let initialDist = 0;
    let initialScale = 1.0;
    let isPinching = false;
    let touchMoved = false;
    let lastTap = 0;

    function getDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    // Touch Start: Detect when 2 fingers touch the glass
    container.addEventListener('touchstart', (e) => {
      touchMoved = false;
      if (e.touches.length === 2) {
        isPinching = true;
        initialDist = getDistance(e.touches);
        initialScale = scale; // Lock onto the current scale as the baseline
      }
    }, { passive: true });

    // Touch Move: Scale dynamically with finger movement
    container.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialDist > 0) {
        e.preventDefault(); // Stop native page stutter
        const currentDist = getDistance(e.touches);
        const factor = currentDist / initialDist;
        
        // Clamp scale between 0.5x and 3.5x
        scale = Math.min(Math.max(initialScale * factor, 0.5), 3.5);
        zoomWrapper.style.transform = `scale(${scale})`;
      } else if (e.touches.length === 1) {
        touchMoved = true; // Mark as a scroll so it doesn't trigger tap reset
      }
    }, { passive: false });

    // Touch End: Lock zoom permanently on release
    container.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialDist = 0;
      }

      // If we just finished a pinch gesture, lock it and do NOT reset
      if (isPinching) {
        if (e.touches.length === 0) {
          isPinching = false;
          lastTap = 0; // Wipe the tap timer so finger liftoff is never read as a double-tap
        }
        return;
      }

      // Ignore normal 1-finger scrolling
      if (touchMoved) {
        lastTap = 0;
        return;
      }

      // Deliberate 1-finger double tap to reset back to 1x
      if (e.touches.length === 0) {
        const now = Date.now();
        if (now - lastTap < 300) {
          scale = 1.0;
          zoomWrapper.style.transform = 'scale(1)';
          lastTap = 0;
        } else {
          lastTap = now;
        }
      }
    });

    // ---------------------------------------------------------
    // FILE RENDERING ENGINE
    // ---------------------------------------------------------
    async function renderFile(file) {
      if (!file) return;

      scale = 1.0;
      zoomWrapper.style.transform = 'scale(1)';

      const ext = file.name ? file.name.split('.').pop().toLowerCase() : '';
      viewer.innerHTML = '<p style="color: #4f46e5; text-align: center; margin-top: 50px;">Opening document...</p>';

      try {
        if (ext === 'docx') {
          viewer.innerHTML = '';
          await docx.renderAsync(file, viewer, null, {
            inWrapper: true,
            ignoreWidth: false,
            breakPages: true
          });
        } else if (ext === 'xlsx' || ext === 'xls') {
          const data = await file.arrayBuffer();
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.SheetNames[0];
          const html = XLSX.utils.sheet_to_html(workbook.Sheets[firstSheet]);
          viewer.innerHTML = `<div class="table-wrapper">${html}</div>`;
        } else {
          viewer.innerHTML = '<p style="color: #ef4444; text-align: center; margin-top: 50px;">Unsupported format.</p>';
        }
      } catch (err) {
        viewer.innerHTML = `<p style="color: #ef4444; text-align: center; margin-top: 50px;">Error rendering: ${err.message}</p>`;
      }
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) renderFile(file);
    });
  </script>
</body>
</html>
