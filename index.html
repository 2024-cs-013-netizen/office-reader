<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doc Viewer</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f111a">

  <!-- Core Libraries -->
  <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
  <script src="https://unpkg.com/docx-preview/dist/docx-preview.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    body { 
      background-color: #0f111a; 
      color: #fff; 
      display: flex; 
      flex-direction: column; 
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
    }
    header { 
      padding: 12px; 
      background: #1a1c29; 
      text-align: center; 
      border-bottom: 1px solid #2d3142; 
    }
    h1 { font-size: 1rem; font-weight: 600; color: #82aaff; }
    .upload-bar { padding: 12px; text-align: center; }
    input[type="file"] { display: none; }
    .btn { 
      background: #4f46e5; 
      color: white; 
      padding: 10px 18px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 0.9rem; 
      display: inline-block; 
      font-weight: 500;
    }
    #viewer-container {
      flex: 1;
      width: 100%;
      padding: 8px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    #viewer { 
      width: 100%; 
      background: #ffffff; 
      color: #000; 
      border-radius: 6px; 
      padding: 10px;
      min-height: 75vh;
      overflow-x: auto;
    }
    .docx-wrapper { background: transparent !important; padding: 0 !important; }
    .docx-wrapper > section.docx { 
      width: 100% !important; 
      max-width: 100% !important; 
      min-height: auto !important; 
      padding: 12px !important; 
      margin: 0 0 10px 0 !important; 
      box-shadow: none !important; 
      box-sizing: border-box !important;
    }
    .docx-wrapper img { max-width: 100% !important; height: auto !important; }
    .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { border-collapse: collapse; width: 100%; white-space: nowrap; }
    th, td { border: 1px solid #d1d5db; padding: 6px 10px; font-size: 0.8rem; text-align: left; }
    th { background: #f3f4f6; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <h1>Personal Document Reader</h1>
  </header>

  <div class="upload-bar">
    <label for="fileInput" class="btn">Select Document (.docx, .xlsx)</label>
    <input type="file" id="fileInput" accept=".docx, .xlsx, .xls">
  </div>

  <div id="viewer-container">
    <div id="viewer">
      <p style="color: #6b7280; text-align: center; margin-top: 40px; font-size: 0.9rem;">
        Choose a file or share one from WhatsApp.
      </p>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const viewer = document.getElementById('viewer');

    // 1. Register the Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(() => {
        console.log('Service Worker Registered');
      });
    }

    // 2. Render Engine
    async function renderFile(file) {
      const ext = file.name ? file.name.split('.').pop().toLowerCase() : '';
      viewer.innerHTML = '<p style="color: #6b7280; text-align: center; margin-top: 40px;">Rendering file...</p>';

      try {
        if (ext === 'docx' || file.type.includes('word')) {
          viewer.innerHTML = '';
          await docx.renderAsync(file, viewer, null, {
            inWrapper: true,
            ignoreWidth: true,
            breakPages: false
          });
        } else {
          const data = await file.arrayBuffer();
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.SheetNames[0];
          const html = XLSX.utils.sheet_to_html(workbook.Sheets[firstSheet]);
          viewer.innerHTML = `<div class="table-wrapper">${html}</div>`;
        }
      } catch (err) {
        viewer.innerHTML = '<p style="color: #ef4444; text-align: center;">Error rendering: ' + err.message + '</p>';
      }
    }

    // 3. Check if opened via WhatsApp Share
    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('shared') === 'true') {
        const cache = await caches.open('shared-files');
        const response = await cache.match('incoming-file');
        if (response) {
          const blob = await response.blob();
          await renderFile(blob);
          await cache.delete('incoming-file');
        }
      }
    });

    // 4. Manual File Picker
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) renderFile(file);
    });
  </script>
</body>
</html>
