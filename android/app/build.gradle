plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.reader.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.reader.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
